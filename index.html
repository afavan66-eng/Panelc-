<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WROX VIP - ADMIN ULTIMATE v11.4</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #3b82f6; --premium: #eab308; --danger: #ef4444; --success: #22c55e; --bg-img: url('https://r.resimlink.com/L7Vv6.png'); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: white; height: 100vh; overflow: hidden; }
        .bg-overlay { position: fixed; inset: 0; background: var(--bg-img) no-repeat center center/cover; opacity: 0.2; z-index: -1; }
        .input-box { width: 100%; padding: 10px; margin: 4px 0; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 8px; color: white; outline: none; box-sizing: border-box; font-size: 13px; }
        .btn-sorgu { width: 100%; background: var(--primary); border:none; padding: 12px; color:white; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:8px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(12, 17, 29, 0.9); border-bottom: 1px solid #1e293b; }
        .side-menu { position: fixed; top: 0; left: -100%; width: 85%; max-width: 280px; height: 100%; background: rgba(7, 10, 17, 0.98); transition: 0.3s; z-index: 1000; padding: 15px; border-right: 2px solid var(--primary); overflow-y: auto; }
        .side-menu.active { left: 0; }
        .page { display: none; padding: 15px; text-align: center; height: calc(100vh - 100px); overflow-y: auto; }
        .page.active { display: block; }
        .result-area { margin-top: 15px; background: rgba(0,0,0,0.9); border-radius: 10px; padding: 12px; text-align: left; font-size: 11px; color: #00ff00; font-family: monospace; border: 1px solid #222; white-space: pre-wrap; }
        .menu-item { padding: 10px; background: rgba(255,255,255,0.03); margin-bottom: 4px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .section-title { color: #666; font-size: 10px; font-weight: bold; margin: 15px 0 5px 5px; text-transform: uppercase; }
        /* Admin Panel Styles */
        .user-card { background: rgba(255,255,255,0.05); padding: 10px; margin-bottom: 10px; border-radius: 10px; text-align: left; border: 1px solid #222; }
        .user-info { font-size: 12px; margin-bottom: 8px; }
        .admin-btns { display: flex; gap: 5px; }
        .adm-btn { flex: 1; padding: 6px; font-size: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<div id="authScreen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div style="background:rgba(17, 24, 39, 0.9); padding:2rem; border-radius:20px; border:1px solid var(--primary); width:85%; max-width:350px; text-align:center;">
        <h2 style="color: var(--primary);">WROX VIP</h2>
        <input type="email" id="u-mail" class="input-box" placeholder="E-posta">
        <input type="password" id="u-pass" class="input-box" placeholder="Şifre">
        <button onclick="handleAuth()" class="btn-sorgu">GİRİŞ</button>
        <p style="font-size:10px; color:#555; margin-top:15px;">Owner: @wrox_19</p>
    </div>
</div>

<div id="mainApp" style="display:none;">
    <div class="side-menu" id="sideMenu">
        <div class="section-title">Sorgular</div>
        <div class="menu-item" onclick="openPage('adsoyad')">🔍 Ad Soyad</div>
        <div class="menu-item" onclick="openPage('tc')">🆔 T.C. Sorgu</div>
        <div class="menu-item" onclick="openPage('aile')">👨‍👩‍👧 Aile Sorgu (FREE)</div>
        <div class="menu-item" onclick="checkVIP('gsm')">📱 GSM -> TC (VIP)</div>
        <div class="menu-item" onclick="checkVIP('wroxcaller')">📞 WROX Caller (VIP)</div>
        
        <div class="section-title">Yönetim</div>
        <div id="admBtn" class="menu-item" onclick="openPage('admin')" style="display:none; color:cyan; font-weight:bold;">👑 ADMIN PANEL</div>
        <div class="menu-item" onclick="logout()" style="color:var(--danger)">🔴 Çıkış</div>
    </div>

    <div class="top-bar">
        <div onclick="document.getElementById('sideMenu').classList.toggle('active')" style="font-size:20px; cursor:pointer;">☰</div>
        <div style="font-weight:bold;">WROX <span style="color:var(--primary)">VIP</span></div>
        <div id="roleBadge" style="font-size:9px; border:1px solid; padding:2px 5px; border-radius:5px;">USER</div>
    </div>

    <div id="pages">
        <div id="page-home" class="page active"><h2>HOŞ GELDİN EFECAN</h2><p>Admin yetkileri aktif edildi.</p></div>
        <div id="page-adsoyad" class="page"><h3>🔍 AD SOYAD</h3><input id="in-ad" class="input-box" placeholder="Ad"><input id="in-soyad" class="input-box" placeholder="Soyad"><button onclick="run('adsoyad')" class="btn-sorgu">SORGULA</button><div id="res-adsoyad" class="result-area"></div></div>
        
        <div id="page-admin" class="page">
            <h3>👑 KULLANICI YÖNETİMİ</h3>
            <div id="userList"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD-heOy-CHV37ofCqNLbjchG5FtU6mRxc", authDomain: "wrox-vip.firebaseapp.com", databaseURL: "https://wrox-vip-default-rtdb.firebaseio.com", projectId: "wrox-vip", appId: "1:322623275508:web:55192bd1063ca6e56f39a1" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function handleAuth() {
        const mail = document.getElementById('u-mail').value.trim().toLowerCase();
        const pass = document.getElementById('u-pass').value;
        if(mail === "afavan66@gmail.com" && pass === "Efecan1903") { 
            localStorage.setItem('session', JSON.stringify({mail, role:'admin'})); location.reload(); 
        } else {
            db.ref('users/' + mail.replace(/\./g, '_')).once('value', s => {
                const u = s.val();
                if(u && u.pass === pass) { localStorage.setItem('session', JSON.stringify(u)); location.reload(); }
                else alert("Hata!");
            });
        }
    }

    const session = JSON.parse(localStorage.getItem('session'));
    if(session) {
        document.getElementById('authScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block';
        document.getElementById('roleBadge').innerText = session.role.toUpperCase();
        if(session.role === 'admin') {
            document.getElementById('admBtn').style.display = 'block';
            loadUsers();
        }
    }

    function loadUsers() {
        db.ref('users').on('value', s => {
            const users = s.val();
            let html = "";
            for(let key in users) {
                const u = users[key];
                html += `
                <div class="user-card">
                    <div class="user-info"><b>${u.mail}</b> [${u.role.toUpperCase()}]</div>
                    <div class="admin-btns">
                        <button class="adm-btn" style="background:var(--success)" onclick="updateRole('${key}', 'premium')">VIP YAP</button>
                        <button class="adm-btn" style="background:var(--primary)" onclick="updateRole('${key}', 'free')">FREE YAP</button>
                        <button class="adm-btn" style="background:var(--danger)" onclick="deleteUser('${key}')">SİL</button>
                    </div>
                </div>`;
            }
            document.getElementById('userList').innerHTML = html;
        });
    }

    function updateRole(key, newRole) {
        db.ref('users/' + key).update({ role: newRole }).then(() => alert("Yetki Güncellendi!"));
    }

    function deleteUser(key) {
        if(confirm("Bu kullanıcıyı silmek istediğine emin misin?")) {
            db.ref('users/' + key).remove().then(() => alert("Kullanıcı Silindi!"));
        }
    }

    function checkVIP(p) { if(session.role === 'admin' || session.role === 'premium') openPage(p); else alert("🔒 VIP Gerekli! @wrox_19"); }
    function openPage(p) { document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); document.getElementById('sideMenu').classList.remove('active'); }
    function logout() { localStorage.removeItem('session'); location.reload(); }
</script>
</body>
</html>
