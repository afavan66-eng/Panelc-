<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WROX VIP - ADMIN CONTROL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #3b82f6; --premium: #eab308; --dark-bg: #0c111d; --card-bg: #111827; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: white; height: 100vh; overflow: hidden; }
        .input-box { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; border-radius: 10px; color: white; outline: none; box-sizing: border-box; }
        .btn-sorgu { width: 100%; background: var(--primary); border:none; padding: 15px; color:white; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:10px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--dark-bg); border-bottom: 1px solid #1e293b; }
        .side-menu { position: fixed; top: 0; left: -100%; width: 85%; max-width: 320px; height: 100%; background: #070a11; transition: 0.4s; z-index: 1000; padding: 20px; border-right: 2px solid var(--primary); overflow-y: auto; }
        .side-menu.active { left: 0; }
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 999; }
        .menu-overlay.active { display: block; }
        .menu-item { padding: 14px; background: var(--card-bg); border-radius: 12px; margin-bottom: 8px; cursor: pointer; border: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .vip-tag { color: var(--premium); border: 1px solid var(--premium); padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .admin-box { border: 1px solid var(--premium); padding: 15px; border-radius: 15px; background: rgba(234, 179, 8, 0.05); margin-bottom: 20px; }
        .user-list { max-height: 120px; overflow-y: auto; background: #000; border-radius: 10px; padding: 10px; font-size: 11px; border: 1px solid #222; text-align: left; margin-top:10px; }
    </style>
</head>
<body>

<div id="authScreen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div style="background:var(--card-bg); padding:2rem; border-radius:20px; border:1px solid var(--primary); width:85%; max-width:360px; text-align:center;">
        <h2 style="color: var(--primary); margin:0;">WROX VIP</h2>
        <input type="email" id="logEmail" class="input-box" placeholder="E-posta">
        <input type="password" id="logPass" class="input-box" placeholder="Şifre">
        <button onclick="handleAuth()" id="authBtn" class="btn-sorgu">GİRİŞ YAP</button>
        <p onclick="toggleAuth()" id="authSwitch" style="color: #94a3b8; font-size: 12px; margin-top: 20px; cursor: pointer; text-decoration: underline;">Kayıt Ol</p>
    </div>
</div>

<div id="mainApp" style="display:none;">
    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div id="adminArea" style="display:none;" class="admin-box">
            <div style="color:var(--premium); font-size:12px; font-weight:bold; margin-bottom:5px;">👑 YETKİ PANELİ</div>
            <input type="text" id="targetMail" class="input-box" placeholder="Kullanıcı Maili" style="font-size:11px; padding:8px;">
            <button onclick="setRole('premium')" style="width:100%; background:var(--premium); border:none; padding:8px; border-radius:5px; font-weight:bold; cursor:pointer;">PREMİUM VER</button>
            <div class="user-list" id="userListDisplay">Yükleniyor...</div>
        </div>

        <p style="color:#475569; font-size:11px; font-weight:bold;">SORGULAR</p>
        <div class="menu-item" onclick="openPage('adsoyad')">🔍 Ad Soyad</div>
        <div class="menu-item" onclick="openPage('tc')">🆔 T.C. Sorgu</div>
        <div id="premiumMenu" style="display:none;">
            <div class="menu-item" onclick="openPage('adres')">📍 Adres <span class="vip-tag">PRE</span></div>
            <div class="menu-item" onclick="openPage('sulale')">🧬 Sülale <span class="vip-tag">PRE</span></div>
        </div>
        <button onclick="logout()" style="width:100%; background:#ef4444; border:none; padding:10px; border-radius:10px; margin-top:20px; color:white; font-weight:bold;">Çıkış</button>
    </div>

    <div class="top-bar">
        <div onclick="toggleMenu()" style="font-size:24px; cursor:pointer; color:var(--primary);">☰</div>
        <div style="color:var(--primary); font-weight:bold;">WROX VIP</div>
        <div style="width:24px;"></div>
    </div>

    <div id="contentArea" style="padding:20px; text-align:center;">
        <div id="page-home"><h2>Hoş Geldin</h2><p>Menüden sorgu seçin.</p></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD-heOy-CHV37ofCqNLbjchG5FtU6mRxc",
        authDomain: "wrox-vip.firebaseapp.com",
        databaseURL: "https://wrox-vip-default-rtdb.firebaseio.com",
        projectId: "wrox-vip",
        appId: "1:322623275508:web:55192bd1063ca6e56f39a1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const BOSS = "afavan66@gmail.com";

    let isLogin = true;
    function toggleAuth() { isLogin = !isLogin; document.getElementById('authBtn').innerText = isLogin ? "GİRİŞ YAP" : "KAYIT OL"; }
    
    function handleAuth() {
        const email = document.getElementById('logEmail').value.trim().toLowerCase();
        const pass = document.getElementById('logPass').value;
        const key = email.replace(/\./g, '_');
        if(isLogin) {
            if(email === BOSS && pass === "Efecan1903") { localStorage.setItem('session', JSON.stringify({email, role:'admin'})); location.reload(); return; }
            db.ref('users/' + key).once('value', s => {
                const u = s.val();
                if(u && u.pass === pass) { localStorage.setItem('session', JSON.stringify(u)); location.reload(); }
                else alert("Hata!");
            });
        } else {
            db.ref('users/' + key).set({email, pass, role:'freemium'}).then(() => { alert("Kayıt başarılı!"); isLogin=true; handleAuth(); });
        }
    }

    const session = JSON.parse(localStorage.getItem('session'));
    if(session) {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if(session.role === 'admin') {
            document.getElementById('adminArea').style.display = 'block';
            document.getElementById('premiumMenu').style.display = 'block';
            db.ref('users').on('value', s => {
                const data = s.val(); let html = "";
                if(data) { Object.keys(data).forEach(k => { html += `<div>${data[k].email} [${data[k].role}]</div>`; }); }
                document.getElementById('userListDisplay').innerHTML = html;
            });
        }
        if(session.role === 'premium') document.getElementById('premiumMenu').style.display = 'block';
    }

    function setRole(r) {
        const mail = document.getElementById('targetMail').value.trim().toLowerCase().replace(/\./g, '_');
        if(mail) db.ref('users/' + mail).update({role: r}).then(() => alert("Yetki Verildi!"));
    }

    function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function logout() { localStorage.removeItem('session'); location.reload(); }
</script>
</body>
</html>
