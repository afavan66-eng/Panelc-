<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WROX VIP - LOGIN & REGISTER</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #3b82f6; --premium: #eab308; --danger: #ef4444; --dark-bg: #0c111d; --card-bg: #111827; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: white; height: 100vh; overflow: hidden; }
        .input-box { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; border-radius: 10px; color: white; outline: none; box-sizing: border-box; }
        .btn-sorgu { width: 100%; background: var(--primary); border:none; padding: 15px; color:white; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:10px; }
        .auth-container { background:var(--card-bg); padding:2rem; border-radius:20px; border:1px solid var(--primary); width:85%; max-width:360px; text-align:center; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab { flex: 1; padding: 10px; cursor: pointer; color: #666; font-weight: bold; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--dark-bg); border-bottom: 1px solid #1e293b; }
        .side-menu { position: fixed; top: 0; left: -100%; width: 85%; max-width: 320px; height: 100%; background: #070a11; transition: 0.4s; z-index: 1000; padding: 20px; border-right: 2px solid var(--primary); overflow-y: auto; }
        .side-menu.active { left: 0; }
        .page { display: none; padding: 20px; text-align: center; height: calc(100vh - 70px); overflow-y: auto; }
        .page.active { display: block; }
        .admin-only { display: none; }
    </style>
</head>
<body>

<div id="authScreen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div class="auth-container">
        <h1 style="color: var(--primary); margin-bottom: 10px;">WROX VIP</h1>
        <div class="tabs">
            <div id="tab-login" class="tab active" onclick="switchAuth('login')">Giriş Yap</div>
            <div id="tab-register" class="tab" onclick="switchAuth('register')">Kayıt Ol</div>
        </div>
        <input type="email" id="authEmail" class="input-box" placeholder="E-posta">
        <input type="password" id="authPass" class="input-box" placeholder="Şifre">
        <button id="authBtn" onclick="handleAuth()" class="btn-sorgu">GİRİŞ YAP</button>
    </div>
</div>

<div id="mainApp" style="display:none;">
    <div class="side-menu" id="sideMenu">
        <p style="color:#475569; font-size:11px; font-weight: bold;">YÖNETİM</p>
        <div class="admin-only" onclick="openPage('admin')" style="cursor:pointer; padding:10px; background:#111; margin-bottom:5px; border-radius:8px;">👑 Kullanıcı Yönetimi</div>
        <div class="admin-only" onclick="openPage('logs')" style="cursor:pointer; padding:10px; background:#111; margin-bottom:5px; border-radius:8px;">📜 Canlı Loglar</div>
        <p style="color:#475569; font-size:11px; font-weight: bold; margin-top:15px;">MENÜ</p>
        <div onclick="openPage('home')" style="cursor:pointer; padding:10px;">🏠 Ana Sayfa</div>
        <div onclick="openPage('adsoyad')" style="cursor:pointer; padding:10px;">🔍 Ad Soyad</div>
        <div onclick="logout()" style="cursor:pointer; padding:10px; color:var(--danger);">❌ Çıkış Yap</div>
    </div>

    <div class="top-bar">
        <div onclick="toggleMenu()" style="font-size:24px; cursor:pointer;">☰</div>
        <div style="color:var(--primary); font-weight:bold;">WROX VIP</div>
        <div id="roleBadge" style="font-size:10px; border:1px solid; padding:2px 5px; border-radius:5px;"></div>
    </div>

    <div id="page-home" class="page active"><h2>Hoş Geldin</h2><p>Panelin tüm API bağlantıları aktiftir.</p></div>
    
    <div id="page-admin" class="page">
        <h3 style="color:var(--premium)">👑 KULLANICI YÖNETİMİ</h3>
        <div id="liveUserList" style="text-align:left;"></div>
    </div>

    <div id="page-logs" class="page"><h3>📜 SİSTEM LOGLARI</h3><div id="logTerminal" style="text-align:left; background:#000; padding:10px; font-family:monospace; font-size:11px;"></div></div>
    
    <div id="page-adsoyad" class="page"><h3>🔍 AD SOYAD SORGULAMA</h3><input id="in-ad" class="input-box" placeholder="Ad"><input id="in-soyad" class="input-box" placeholder="Soyad"><button onclick="alert('API Bağlı!')" class="btn-sorgu">SORGULA</button></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD-heOy-CHV37ofCqNLbjchG5FtU6mRxc", authDomain: "wrox-vip.firebaseapp.com", databaseURL: "https://wrox-vip-default-rtdb.firebaseio.com", projectId: "wrox-vip", appId: "1:322623275508:web:55192bd1063ca6e56f39a1" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let authMode = 'login';

    function switchAuth(mode) {
        authMode = mode;
        document.getElementById('tab-login').classList.toggle('active', mode === 'login');
        document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        document.getElementById('authBtn').innerText = mode === 'login' ? 'GİRİŞ YAP' : 'KAYIT OL';
    }

    function handleAuth() {
        const email = document.getElementById('authEmail').value.trim().toLowerCase();
        const pass = document.getElementById('authPass').value;
        const key = email.replace(/\./g, '_');

        if (authMode === 'register') {
            db.ref('users/' + key).set({ email, pass, role: 'free' }).then(() => {
                alert("Başarıyla kayıt olundu! Şimdi giriş yapabilirsin.");
                switchAuth('login');
            });
        } else {
            // GİRİŞ KONTROLÜ
            if(email === "afavan66@gmail.com" && pass === "Efecan1903") {
                const admin = { email, role: 'admin' };
                localStorage.setItem('session', JSON.stringify(admin));
                location.reload();
            } else {
                db.ref('users/' + key).once('value', s => {
                    const u = s.val();
                    if(u && u.pass === pass) {
                        localStorage.setItem('session', JSON.stringify(u));
                        location.reload();
                    } else alert("Hatalı bilgiler!");
                });
            }
        }
    }

    const session = JSON.parse(localStorage.getItem('session'));
    if(session) {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('roleBadge').innerText = session.role.toUpperCase();
        if(session.role === 'admin') {
            document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'block');
            startAdminMonitoring();
        }
    }

    function startAdminMonitoring() {
        db.ref('users').on('value', snapshot => {
            const div = document.getElementById('liveUserList');
            div.innerHTML = "";
            const users = snapshot.val();
            for(let key in users) {
                const u = users[key];
                div.innerHTML += `
                <div style="background:#111; padding:10px; margin-bottom:5px; border-radius:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:12px;">${u.email} <br> <span style="color:var(--premium)">${u.role}</span></div>
                    <div>
                        <button onclick="db.ref('users/${key}').update({role:'premium'})" style="background:var(--premium); border:none; padding:5px; border-radius:5px;">VIP Yap</button>
                        <button onclick="db.ref('users/${key}').remove()" style="background:red; border:none; padding:5px; border-radius:5px;">❌</button>
                    </div>
                </div>`;
            }
        });
    }

    function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
    function openPage(p) { document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); toggleMenu(); }
    function logout() { localStorage.removeItem('session'); location.reload(); }
</script>
</body>
</html>
