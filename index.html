<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>WROX VIP - Cloud Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #3b82f6; --premium: #eab308; --danger: #ef4444; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; height: 100vh; overflow: hidden; }
        #authScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 99999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .card { background: rgba(15, 23, 42, 0.9); padding: 2rem; border-radius: 15px; border: 1px solid var(--primary); width: 85%; max-width: 350px; }
        .input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; border-radius: 8px; color: white; box-sizing: border-box; }
        .button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        #logoutBtn { position: fixed; top: 15px; right: 15px; z-index: 10001; background: var(--danger); border: 1px solid white; color: white; padding: 8px 15px; border-radius: 8px; font-weight: bold; display: none; }
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #0a0a0a; padding: 70px 15px; transition: 0.3s; z-index: 10000; border-right: 1px solid #222; }
        .sidebar.active { left: 0; }
        #adminArea { background: #1a1a1a; padding: 10px; border-radius: 10px; border: 1px solid var(--premium); margin-bottom: 20px; font-size: 12px; }
        .user-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="card">
        <h2 style="text-align:center; color: var(--primary);">WROX VIP GİRİŞ</h2>
        <input type="email" id="email" class="input" placeholder="E-posta">
        <input type="password" id="pass" class="input" placeholder="Şifre">
        <button class="button" style="background:var(--primary); color:white" onclick="handleAuth()">DEVAM ET</button>
        <p id="toggleT" onclick="toggleM()" style="text-align:center; font-size:12px; cursor:pointer; color:#aaa; margin-top:15px;">Kayıt Olmak İçin Tıkla</p>
    </div>
</div>

<div id="logoutBtn" onclick="logout()">ÇIKIŞ YAP</div>
<div id="menuIcon" onclick="document.getElementById('sidebar').classList.toggle('active')" style="position:fixed; top:15px; left:15px; z-index:10002; cursor:pointer; font-size:24px;">☰</div>

<div id="mainApp" style="display:none;">
    <div class="sidebar" id="sidebar">
        <div id="adminArea" style="display:none;">
            <p style="color:var(--premium); margin-top:0;">👑 Admin Paneli</p>
            <div id="userList" style="max-height:100px; overflow-y:auto; margin-bottom:10px;"></div>
            <input type="email" id="tMail" class="input" placeholder="Mail Adresi" style="font-size:11px;">
            <button class="button" style="background:var(--premium); font-size:11px; padding:5px;" onclick="setRole('premium')">PRE VER</button>
            <button class="button" style="background:var(--danger); font-size:11px; padding:5px;" onclick="setRole('delete')">SİL</button>
        </div>
        <div id="queries">
            <div style="padding:10px; background:#222; margin-bottom:5px; border-radius:5px;">TC Sorgu</div>
            <div style="padding:10px; background:#222; margin-bottom:5px; border-radius:5px;">Ad Soyad Sorgu</div>
        </div>
    </div>
    <div style="padding:100px 20px; text-align:center;">
        <h1 style="color:var(--primary);">WROX VIP</h1>
        <p id="userMailDisplay"></p>
    </div>
</div>

<script>
    // FIREBASE AYARLARINI BURAYA YAPIŞTIR
    const firebaseConfig = {
        apiKey: "GÖRSELDEKİ_API_KEY",
        authDomain: "wrox-vip.firebaseapp.com",
        databaseURL: "https://wrox-vip-default-rtdb.firebaseio.com",
        projectId: "wrox-vip",
        storageBucket: "wrox-vip.appspot.com",
        messagingSenderId: "322623275508",
        appId: "GÖRSELDEKİ_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let isLogin = true;

    function handleAuth() {
        const e = document.getElementById('email').value.replace(/\./g, '_');
        const p = document.getElementById('pass').value;
        if(isLogin) {
            db.ref('users/' + e).once('value', s => {
                const u = s.val();
                if(u && u.pass === p) {
                    localStorage.setItem('wrox_user', JSON.stringify(u));
                    location.reload();
                } else alert("Hata!");
            });
        } else {
            db.ref('users/' + e).set({ email: e.replace(/_/g, '.'), pass: p, role: 'freemium' });
            alert("Kayıt ok! Giriş yap."); location.reload();
        }
    }

    const curr = JSON.parse(localStorage.getItem('wrox_user'));
    if(curr) {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'block';
        document.getElementById('userMailDisplay').innerText = "Aktif Kullanıcı: " + curr.email;
        if(curr.email === "afavan66@gmail.com") {
            document.getElementById('adminArea').style.display = 'block';
            db.ref('users').on('value', s => {
                const all = s.val(); let h = "";
                for(let k in all) h += `<div class="user-row"><span>${all[k].email}</span> <span>${all[k].role}</span></div>`;
                document.getElementById('userList').innerHTML = h;
            });
        }
    }

    function setRole(r) {
        const m = document.getElementById('tMail').value.replace(/\./g, '_');
        if(r === 'delete') db.ref('users/' + m).remove();
        else db.ref('users/' + m).update({ role: r });
        alert("İşlem Başarılı!");
    }

    function toggleM() { isLogin = !isLogin; document.getElementById('toggleT').innerText = isLogin ? "Kayıt Ol" : "Giriş Yap"; }
    function logout() { localStorage.removeItem('wrox_user'); location.reload(); }
</script>
</body>
</html>
